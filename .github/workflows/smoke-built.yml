name: smoke-built

# The projects of corpus/smoke-built.tsv, checked as the smoke workflow checks
# them, then built with their own build tool and checked again
# (scripts/smoke.py --build). The class files a build leaves are grounds'
# evidence of which files the build compiles; the summary says how the
# compile-break findings stand after it. On a build that succeeded, one left
# "in the build" is a false claim. Nothing is failed on but what the smoke
# workflow fails on (a panic, a run over the time limit); a build that fails
# is reported. On demand only: the builds take hours of runner time.
#
# The builds run code of the projects: the jobs get a read-only token and the
# checkout of this repository keeps no credentials.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated project names (default: all of corpus/smoke-built.tsv)"
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.projects.outputs.projects }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: projects
        run: |
          echo "projects=$(grep -v '^#' corpus/smoke-built.tsv | awk -F'\t' -v only="$ONLY" 'BEGIN { n = split(only, o, ","); for (i = 1; i <= n; i++) want[o[i]] = 1 } NF >= 4 && (only == "" || $1 in want) { print $1 "\t" $2 }' | jq -R 'split("\t") | {name: .[0], java: .[1]}' | jq -cs .)" >> "$GITHUB_OUTPUT"
        env:
          ONLY: ${{ inputs.only }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p grounds-cli && cargo build --release --locked -p grounds-syntax --example errors
      - uses: actions/upload-artifact@v5
        with:
          name: binaries
          path: |
            target/release/grounds
            target/release/examples/errors

  built:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.build.outputs.projects) }}
    name: ${{ matrix.project.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.project.java }}
      - uses: actions/download-artifact@v5
        with:
          name: binaries
          path: bin
      - run: chmod +x bin/grounds bin/examples/errors
      - name: check, build, check again
        run: |
          python3 -I scripts/smoke.py --only "${{ matrix.project.name }}" --build --timeout 900 \
            --grounds bin/grounds --errors bin/examples/errors --dir "$RUNNER_TEMP/smoke" --out "smoke-built-${{ matrix.project.name }}.json"
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-built-${{ matrix.project.name }}
          path: smoke-built-${{ matrix.project.name }}.json
          if-no-files-found: ignore

  summary:
    needs: built
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          pattern: smoke-built-*
          merge-multiple: true
          path: reports
      - run: |
          if ls reports/*.json > /dev/null 2>&1; then
            python3 -I scripts/smoke.py --summary reports/*.json | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "no reports" >> "$GITHUB_STEP_SUMMARY"
          fi
