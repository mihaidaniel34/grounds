name: fuzz-nightly

# The javac fuzzers on new cases every night: the seed is the date, so a
# night's cases can be rerun exactly (`--seed YYYYMMDD`), while the fixed
# seeds in fuzz.yml stay the regression gate. Nothing is baselined here:
# every wrong type or false error of the night is listed in the summary and
# its cases uploaded. The run fails when there is any, as a notification.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed (default: today's date, YYYYMMDD)"
        required: false

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        fuzzer: [calls, overloads, access]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - id: seed
        run: echo "seed=${SEED:-$(date -u +%Y%m%d)}" >> "$GITHUB_OUTPUT"
        env:
          SEED: ${{ inputs.seed }}
      - run: python3 -I scripts/fuzz_${{ matrix.fuzzer }}.py --seed ${{ steps.seed.outputs.seed }} --cases 6000 --baseline /dev/null | tee out.txt
      - if: always()
        run: |
          { echo "### ${{ matrix.fuzzer }}, seed ${{ steps.seed.outputs.seed }}"; echo '```'; head -60 out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: fuzz-${{ matrix.fuzzer }}-${{ steps.seed.outputs.seed }}
          path: target/fuzz-${{ matrix.fuzzer }}/seed-${{ steps.seed.outputs.seed }}/
