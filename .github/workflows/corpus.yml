name: corpus

# The regression corpus (corpus/projects.tsv), one parallel job per project:
# zero parse errors, zero findings from rules that claim the code would not
# compile or start, the planted bugs still reported, and a findings snapshot
# diffed against a baseline. Two setups per project:
# - check: a fresh checkout, no jars at all (baseline corpus/ci); most calls
#   into libraries stay unknown, as for an agent in a repo never built;
# - classpath: `grounds classpath` first (Maven/Gradle resolve the exact
#   classpath) with scan_caches = false (baseline corpus/ci-classpath); the
#   compile-break rules check the most here, against code that compiles.
#   Projects whose build cannot dump a classpath on a runner are listed, with
#   the reason, in corpus/classpath-skip.tsv.
# The no-jars job also runs CI mode under scripted edits (ci_mutations.py).
# To accept new results, run with `update-baseline` and commit the artifact.
on:
  pull_request:
    paths:
      - "crates/**"
      - "corpus/**"
      - "scripts/corpus.sh"
      - "Cargo.lock"
      - ".github/workflows/corpus.yml"
  workflow_dispatch:
    inputs:
      update-baseline:
        description: "Upload the current findings as a corpus-baseline artifact"
        type: boolean
        default: false

concurrency:
  group: corpus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.projects.outputs.names }}
      classpath-projects: ${{ steps.projects.outputs.classpath }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p grounds-cli && cargo build --release --locked -p grounds-syntax --example errors
      - uses: actions/upload-artifact@v5
        with:
          name: binaries
          path: |
            target/release/grounds
            target/release/examples/errors
      - id: projects
        run: |
          # helidon runs on JDK 27 in check-jdk27 instead
          echo "names=$(cut -f1 corpus/projects.tsv | grep -vx helidon | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
          # projects whose build cannot dump a classpath on a runner (reasons in the file)
          echo "classpath=$(cut -f1 corpus/projects.tsv | grep -vxF -f <(cut -f1 corpus/classpath-skip.tsv) | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  check:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.build.outputs.projects) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # the same JDK API signatures as the baseline was made with
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/download-artifact@v5
        with:
          name: binaries
          path: bin
      - run: chmod +x bin/grounds bin/examples/errors
      - name: fetch the pinned commit
        run: scripts/corpus.sh fetch
        env:
          CORPUS_ONLY: ${{ matrix.project }}
          CORPUS_DIR: ${{ runner.temp }}/corpus
          CORPUS_SHALLOW: "1"
      # the planted bugs need Spring's jars to be judged at all
      - if: hashFiles(format('corpus/planted/{0}.patch', matrix.project)) != ''
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ matrix.project }}-${{ hashFiles('corpus/projects.tsv') }}
      - if: hashFiles(format('corpus/planted/{0}.patch', matrix.project)) != ''
        working-directory: ${{ runner.temp }}/corpus/${{ matrix.project }}
        run: ./mvnw -q -B dependency:go-offline || mvn -q -B dependency:go-offline
      - name: check
        run: scripts/corpus.sh check
        env:
          CORPUS_ONLY: ${{ matrix.project }}
          CORPUS_DIR: ${{ runner.temp }}/corpus
          CORPUS_BASELINE: corpus/ci
          GROUNDS: bin/grounds
          ERRORS: ${{ github.workspace }}/bin/examples/errors
      # CI mode under scripted edits (scripts/ci_mutations.py): edits that cannot
      # break anything must get no report from `changed --base`; renamed public
      # methods with callers count toward a recall statistic
      - name: mutations
        run: python3 -I scripts/ci_mutations.py "$CORPUS_DIR/${{ matrix.project }}" --grounds bin/grounds --safe 8 --breaking 4 --out target/corpus/mutations.json
        env:
          CORPUS_DIR: ${{ runner.temp }}/corpus
      - name: summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.project }}: calls resolved $(cut -f2 target/corpus/current/stats.tsv 2>/dev/null)"
            [ -f target/corpus/mutations.json ] && python3 scripts/ci_mutations.py --summary target/corpus/mutations.json
            if [ -s target/corpus/snapshot.diff ]; then
              echo "<details><summary>snapshot diff</summary>"; echo; echo '```diff'; head -200 target/corpus/snapshot.diff; echo '```'; echo "</details>"
            else
              echo "snapshot unchanged"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: corpus-${{ matrix.project }}
          path: |
            target/corpus/current/*.txt
            target/corpus/current/stats.tsv
            target/corpus/snapshot.diff
            target/corpus/planted-*.diff
            target/corpus/mutations.json

  # helidon on JDK 21: the release it infers (27) is newer than the JDK, which
  # used to report the JDK 20 API's missing members (getFirst, a Java 21 method)
  # as compile breaks. Only the hard checks gate here: the snapshot is against
  # the JDK 25 baseline, so its diff is informational.
  check-jdk21:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v5
        with:
          name: binaries
          path: bin
      - run: chmod +x bin/grounds bin/examples/errors
      - name: fetch the pinned commit
        run: scripts/corpus.sh fetch
        env:
          CORPUS_ONLY: helidon
          CORPUS_DIR: ${{ runner.temp }}/corpus
          CORPUS_SHALLOW: "1"
      - name: check
        run: scripts/corpus.sh check
        env:
          CORPUS_ONLY: helidon
          CORPUS_DIR: ${{ runner.temp }}/corpus
          CORPUS_BASELINE: corpus/ci
          GROUNDS: bin/grounds
          ERRORS: ${{ github.workspace }}/bin/examples/errors
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: corpus-helidon-jdk21
          path: |
            target/corpus/current/*.txt
            target/corpus/current/stats.tsv
            target/corpus/snapshot.diff

  # helidon on JDK 27 (early access): the release it infers is 27, so with the JDK
  # at 27 grounds reads that release exactly from lib/modules, and the compile-break
  # checks run against the real API rather than an older one. Only the hard checks
  # gate here; the snapshot diff against the JDK 25 baseline is informational.
  # To bump the build, change java-version to the new early-access build (the
  # setup-java README lists the forms it accepts); the other projects stay on 25.
  check-jdk27:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 27-ea
      - uses: actions/download-artifact@v5
        with:
          name: binaries
          path: bin
      - run: chmod +x bin/grounds bin/examples/errors
      - name: fetch the pinned commit
        run: scripts/corpus.sh fetch
        env:
          CORPUS_ONLY: helidon
          CORPUS_DIR: ${{ runner.temp }}/corpus
          CORPUS_SHALLOW: "1"
      - name: check
        run: scripts/corpus.sh check
        env:
          CORPUS_ONLY: helidon
          CORPUS_DIR: ${{ runner.temp }}/corpus
          CORPUS_BASELINE: corpus/ci
          GROUNDS: bin/grounds
          ERRORS: ${{ github.workspace }}/bin/examples/errors
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: corpus-helidon-jdk27
          path: |
            target/corpus/current/*.txt
            target/corpus/current/stats.tsv
            target/corpus/snapshot.diff

  classpath:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.build.outputs.classpath-projects) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # 17, 21 and 25 run the builds (Gradle 7 needs 17, the plugins of
      # Gradle 9 builds often 25, Maven 21); 25, the default, gives grounds
      # the JDK API the baselines were made with
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - uses: actions/download-artifact@v5
        with:
          name: binaries
          path: bin
      - run: chmod +x bin/grounds bin/examples/errors
      - name: fetch the pinned commit
        run: scripts/corpus.sh fetch
        env:
          CORPUS_ONLY: ${{ matrix.project }}
          CORPUS_DIR: ${{ runner.temp }}/corpus
          CORPUS_SHALLOW: "1"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: deps-${{ matrix.project }}-${{ hashFiles('corpus/projects.tsv') }}
      - name: grounds classpath
        run: |
          dir=$CORPUS_DIR/$PROJECT
          if [ "$PROJECT" = buckpal ]; then export JAVA_HOME=$JAVA_HOME_17_X64
          elif [ -f "$dir/gradlew" ]; then export JAVA_HOME=$JAVA_HOME_25_X64
          else export JAVA_HOME=$JAVA_HOME_21_X64; fi
          scripts/corpus.sh classpath
        env:
          PROJECT: ${{ matrix.project }}
          CORPUS_ONLY: ${{ matrix.project }}
          CORPUS_DIR: ${{ runner.temp }}/corpus
          GROUNDS: bin/grounds
          MAVEN_ARGS: -B -ntp
      - name: check
        run: scripts/corpus.sh check
        env:
          CORPUS_ONLY: ${{ matrix.project }}
          CORPUS_DIR: ${{ runner.temp }}/corpus
          CORPUS_BASELINE: corpus/ci-classpath
          GROUNDS: bin/grounds
          ERRORS: ${{ github.workspace }}/bin/examples/errors
      - name: summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.project }} (classpath): calls resolved $(cut -f2 target/corpus/current/stats.tsv 2>/dev/null)"
            if [ -s target/corpus/snapshot.diff ]; then
              echo "<details><summary>snapshot diff</summary>"; echo; echo '```diff'; head -200 target/corpus/snapshot.diff; echo '```'; echo "</details>"
            else
              echo "snapshot unchanged"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: corpus-cp-${{ matrix.project }}
          path: |
            target/corpus/current/*.txt
            target/corpus/current/stats.tsv
            target/corpus/snapshot.diff

  baseline:
    needs: [check, classpath]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.update-baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: corpus-*
          path: results
      - run: |
          mkdir -p corpus/ci corpus/ci-classpath
          for d in results/corpus-*; do
            case $d in
              results/corpus-helidon-jdk21) ;; # not a baseline: JDK 21 results differ
              results/corpus-cp-*) cp "$d"/current/*.txt corpus/ci-classpath/ ;;
              *) cp "$d"/current/*.txt corpus/ci/ ;;
            esac
          done
          ls corpus/ci corpus/ci-classpath
      - uses: actions/upload-artifact@v5
        with:
          name: corpus-baseline
          path: |
            corpus/ci/*.txt
            corpus/ci-classpath/*.txt
