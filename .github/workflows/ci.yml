name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            java: 21
          - os: ubuntu-latest
            java: 25
          - os: macos-14
            java: 21
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # the analysis and the tests read the JDK's API signatures (ct.sym); the
      # release-newer-than-the-JDK tests run against each installed JDK
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
