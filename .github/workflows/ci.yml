name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            java: 21
          - os: ubuntu-latest
            java: 25
          - os: macos-14
            java: 21
    # the JDK 21 jobs keep the plain names branch protection requires
    name: test (${{ matrix.os }}${{ matrix.java != 21 && format(', jdk {0}', matrix.java) || '' }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2   # a pull request's merge commit and the base it merges into
      # a pull request that changes only the landing page skips the build; the
      # job still runs and reports under its required name, so it can merge
      - id: changes
        if: github.event_name == 'pull_request'
        run: git diff --quiet HEAD^1 HEAD -- . ':!site' && echo "skip=true" >> "$GITHUB_OUTPUT" || true
      # the analysis and the tests read the JDK's API signatures (ct.sym); the
      # release-newer-than-the-JDK tests run against each installed JDK
      - uses: actions/setup-java@v5
        if: steps.changes.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.skip != 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.skip != 'true'
      - run: cargo test --workspace --locked
        if: steps.changes.outputs.skip != 'true'
